name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (swift test)
        run: swift test
      - name: Static checks (tests/run.sh)
        run: tests/run.sh --static-only
      - name: Build app (debug)
        run: ./build.sh --debug
