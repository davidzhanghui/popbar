name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.1)'
        required: true

jobs:
  # 分别在 Apple Silicon 与 Intel runner 上构建,各出一个架构的 dmg
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4

      # 打包前先跑一遍测试:逻辑测试 + 静态检查,任何一项失败都不出包
      - name: Test
        run: |
          swift test
          tests/run.sh --static-only

      - name: Import code signing certificate
        env:
          CODESIGN_CERT_P12_BASE64: ${{ secrets.CODESIGN_CERT_P12_BASE64 }}
          CODESIGN_CERT_PASSWORD: ${{ secrets.CODESIGN_CERT_PASSWORD }}
        run: |
          if [ -z "$CODESIGN_CERT_P12_BASE64" ] || [ -z "$CODESIGN_CERT_PASSWORD" ]; then
            echo "::error::Missing CODESIGN_CERT_P12_BASE64 or CODESIGN_CERT_PASSWORD secret"
            exit 1
          fi
          CERT_PATH="$RUNNER_TEMP/popbar-codesign.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/popbar-signing.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -hex 24)

          printf '%s' "$CODESIGN_CERT_P12_BASE64" | tr -d '[:space:]' | base64 -D > "$CERT_PATH"
          chmod 600 "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CODESIGN_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH" >/dev/null

          # 将临时钥匙串加入搜索列表，确保 codesign 能定位自签名证书
          KEYCHAINS=("$KEYCHAIN_PATH")
          while IFS= read -r kc; do
            [ -n "$kc" ] && KEYCHAINS+=("$kc")
          done < <(security list-keychains -d user | awk -F'"' '/"/{print $2}')
          security list-keychains -d user -s "${KEYCHAINS[@]}"

          # 自动提取证书 SHA-1 指纹（同时兼容固定自签名证书与未来的 Developer ID 证书）
          IDENTITY_HASH=$(security find-identity -p codesigning "$KEYCHAIN_PATH" | awk '/^[[:space:]]*[0-9]+\)/ {print $2; exit}')
          if [ -z "$IDENTITY_HASH" ]; then
            echo "::error::No code signing identity found in imported .p12"
            security find-identity -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY_HASH" >> "$GITHUB_ENV"
          echo "CODESIGN_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "Imported signing identity: $IDENTITY_HASH"
          rm -f "$CERT_PATH"

      - name: Build & package
        env:
          REQUIRE_CODESIGN: "1"
        run: |
          ./build.sh   # dmg 文件名自动带 uname -m 架构后缀
          codesign -dv --verbose=2 build.noindex/PopBar.app 2>&1
          codesign -d -r - build.noindex/PopBar.app 2>&1
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build.noindex/PopBar.app/Contents/Info.plist)
          ARCH=$(uname -m)
          ditto -c -k --keepParent build.noindex/PopBar.app "build/PopBar-${VERSION}-${ARCH}.app.zip"

      - name: Clean up signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/popbar-codesign.p12"
          if [ -n "${CODESIGN_KEYCHAIN:-}" ] && [ -f "$CODESIGN_KEYCHAIN" ]; then
            security delete-keychain "$CODESIGN_KEYCHAIN" || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            build/*.dmg
            build/*.app.zip

  # 两个架构都成功后,把 dmg 一起挂到同一个 Release
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GITHUB_TOKEN 建 release 需要的权限
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compose bilingual release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          ## 下载 | Downloads

          | 芯片 | Chip | 文件 |
          |---|---|---|
          | Apple Silicon (M 系列) | Apple Silicon | `*-arm64.dmg` |
          | Intel | Intel | `*-x86_64.dmg` |

          ## 安装 | Install

          **中文**:打开 dmg,把 `PopBar.app` 拖入 `Applications`。
          本应用未经 Apple 公证,首次打开若提示「已损坏,无法打开」,在终端执行一次:

          ```bash
          xattr -cr /Applications/PopBar.app
          ```

          首次启动还需在「系统设置 → 隐私与安全性」中允许 PopBar 的「辅助功能」和「输入监控」（后者用于拖拽 / 双击划词）；截屏 / 截图翻译需另行允许「屏幕录制」。

          **English**: Open the dmg and drag `PopBar.app` into `Applications`.
          The app is not notarized; if macOS reports it "damaged", run once in Terminal:

          ```bash
          xattr -cr /Applications/PopBar.app
          ```

          Then allow PopBar under System Settings → Privacy & Security → Accessibility and Input Monitoring (the latter is required for drag / double-click selection). Screenshot / Screenshot Translate additionally needs Screen Recording.
          EOF
          # 追加自动生成的变更列表(英文,来自 PR/commit 标题)
          AUTO=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" --jq .body 2>/dev/null || true)
          if [ -n "$AUTO" ]; then
            printf '\n---\n\n%s\n' "$AUTO" >> release-notes.md
          fi

      - name: Create release & upload signed artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::Missing RELEASE_SIGNING_KEY secret"
            exit 1
          fi
          (cd dist && sha256sum *.dmg *.app.zip > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
          printf '%s\n' "$RELEASE_SIGNING_KEY" > /tmp/release-signing.pem
          chmod 600 /tmp/release-signing.pem
          openssl pkeyutl -sign -inkey /tmp/release-signing.pem -rawin -in dist/SHA256SUMS.txt -out dist/SHA256SUMS.txt.sig
          openssl pkey -in /tmp/release-signing.pem -pubout -out /tmp/release-signing.pub.pem
          openssl pkeyutl -verify -pubin -inkey /tmp/release-signing.pub.pem -rawin -in dist/SHA256SUMS.txt -sigfile dist/SHA256SUMS.txt.sig
          rm -f /tmp/release-signing.pem /tmp/release-signing.pub.pem
          ls -l dist/
          gh release create "$RELEASE_TAG" dist/*.dmg dist/*.app.zip dist/SHA256SUMS.txt dist/SHA256SUMS.txt.sig \
            -R "$GITHUB_REPOSITORY" \
            --title "PopBar $RELEASE_TAG" \
            --notes-file release-notes.md
